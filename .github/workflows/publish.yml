name: Publish Package to npm
on:
  push:
    tags:
      - '@lilian1315/create-element@*.*.*'
      - '@lilian1315/oxlint-plugin-create-element@*.*.*'
      - '@lilian1315/elements-writable-properties-types@*.*.*'
  workflow_dispatch: # Allows manual triggering of the workflow.

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write # Required for OIDC
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true
          run-install: true
      - run: vpr build
      - run: vp exec playwright install --with-deps chromium
      - run: vpr test
      - run: vp check
      - name: Resolve publish target from tag
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "npm-filter=@lilian1315/*" >> "$GITHUB_OUTPUT"
          else
            NAME="${GITHUB_REF_NAME%@*}"
            grep -q "\"name\": \"$NAME\"" packages/*/package.json || { echo "error: unknown package tag '$GITHUB_REF_NAME'"; exit 1; }
            echo "npm-filter=$NAME" >> "$GITHUB_OUTPUT"
          fi
      - name: Materialize core package README for publishing
        # npm omits symlinks. Replace the link without overwriting its root target.
        run: cp --remove-destination README.md packages/create-element/README.md
      - name: Publish to npm
        run: vp pm publish --filter '${{ steps.target.outputs.npm-filter }}' --no-git-checks --access public
