name: Publish Package to npmjs and jsr
on:
  push:
    tags:
      - '@lilian1315/create-element@*.*.*'
      - '@lilian1315/oxlint-plugin-create-element@*.*.*'
      - '@lilian1315/elements-writable-properties-types@*.*.*'
  workflow_dispatch: # Allows manual triggering of the workflow.

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write # Required for OIDC
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
          run-install: true
      - run: vpr build
      - run: vp exec -F @lilian1315/create-element playwright install --with-deps chromium
      - run: vpr test
      - run: vpr -F @lilian1315/create-element test:exports
      - run: vp check
      - name: Resolve publish target from tag
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "npm-filter=@lilian1315/*" >> "$GITHUB_OUTPUT"
          else
            NAME="${GITHUB_REF_NAME%@*}"
            DIR=$(grep -l "\"name\": \"$NAME\"" packages/*/package.json | xargs dirname)
            [ -n "$DIR" ] || { echo "error: unknown package tag '$GITHUB_REF_NAME'"; exit 1; }
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
            echo "npm-filter=$NAME" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to JSR
        working-directory: ${{ steps.target.outputs.dir }}
        run: vpx jsr publish
      - name: Publish to npm
        run: vp pm publish --filter '${{ steps.target.outputs.npm-filter }}' --no-git-checks --access public
